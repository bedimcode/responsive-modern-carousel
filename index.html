<!DOCTYPE html>
   <html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <!--=============== REMIXICONS - Insert link for icons ===============-->
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.9.1/fonts/remixicon.css">

      <!--=============== SWIPER CSS ===============-->
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@14.3.0/swiper-bundle.min.css">

      <!--=============== CSS ===============-->
      <link rel="stylesheet" href="assets/css/styles.css">

      <title>Responsive modern carousel - Bedimcode</title>
   </head>
   <body>
      <!--==================== MAIN ====================-->
      <main class="main">
         <!--==================== CARD ====================-->
         <section class="card">
            <div class="card__swiper swiper">
               <div class="card__wrapper swiper-wrapper">
                  <article class="card__article swiper-slide">
                     <div class="card__content">
                        <div class="card__data">
                           <h2 class="card__title">Funky Twist</h2>
                           <h3 class="card__subtitle">Desktop</h3>
                        </div>

                        <div class="card__footer">
                           <span class="card__logo">bdc</span>
                           <span class="card__number">01</span>
                        </div>
                     </div>
                  </article>

                  <article class="card__article swiper-slide">
                     <div class="card__content">
                        <div class="card__data">
                           <h2 class="card__title">Night Drive</h2>
                           <h3 class="card__subtitle">Tablet</h3>
                        </div>

                        <div class="card__footer">
                           <span class="card__logo">bdc</span>
                           <span class="card__number">02</span>
                        </div>
                     </div>
                  </article>

                  <article class="card__article swiper-slide">
                     <div class="card__content">
                        <div class="card__data">
                           <h2 class="card__title">Soft Motion</h2>
                           <h3 class="card__subtitle">Mobile</h3>
                        </div>

                        <div class="card__footer">
                           <span class="card__logo">bdc</span>
                           <span class="card__number">03</span>
                        </div>
                     </div>
                  </article>

                  <article class="card__article swiper-slide">
                     <div class="card__content">
                        <div class="card__data">
                           <h2 class="card__title">Velvet Glow</h2>
                           <h3 class="card__subtitle">Desktop</h3>
                        </div>

                        <div class="card__footer">
                           <span class="card__logo">bdc</span>
                           <span class="card__number">04</span>
                        </div>
                     </div>
                  </article>

                  <article class="card__article swiper-slide">
                     <div class="card__content">
                        <div class="card__data">
                           <h2 class="card__title">Golden Hour</h2>
                           <h3 class="card__subtitle">Tablet</h3>
                        </div>

                        <div class="card__footer">
                           <span class="card__logo">bdc</span>
                           
                           <span class="card__number">05</span>
                        </div>
                     </div>
                  </article>

                  <article class="card__article swiper-slide">
                     <div class="card__content">
                        <div class="card__data">
                           <h2 class="card__title">Deep Echo</h2>
                           <h3 class="card__subtitle">Mobile</h3>
                        </div>

                        <div class="card__footer">
                           <span class="card__logo">bdc</span>
                           <span class="card__number">06</span>
                        </div>
                     </div>
                  </article>
               </div>
            </div>

            <!--==================== CONTROLS ====================-->
            <div class="card__controls">
               <button class="card__button card__button-prev" aria-label="Previous card">
                  <i class="ri-arrow-left-s-line"></i>
               </button>

               <div class="card__pagination"></div>

               <button class="card__button card__button-next" aria-label="Next card">
                  <i class="ri-arrow-right-s-line"></i>
               </button>
            </div>
         </section>
      </main>

      <!--=============== SWIPER JS ===============-->
      <script src="https://cdn.jsdelivr.net/npm/swiper@14.3.0/swiper-bundle.min.js"></script>

      <!--=============== MAIN JS ===============-->
      <script src="assets/js/main.js"></script>
   </body>
</html>
